[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:blockchain]
command=anvil --host 127.0.0.1 --port 8545 --chain-id 31337 --silent
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:storage-nodes]
command=python -m storage_node --cluster 3 --host 127.0.0.1 --port 9101 --http-port 9301 --data-dir /data/nodes
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=/app/deploy/start-web.sh
directory=/app
priority=30
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:monitor]
command=/app/deploy/start-monitor.sh
directory=/app
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
