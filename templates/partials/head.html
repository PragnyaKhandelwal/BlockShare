{% load static %}<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    /* Apply the saved (or OS) colour theme before first paint to avoid a flash. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("bs-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0d1324" : "#ffffff");
    })();
  </script>
  <link rel="manifest" href="{% url 'manifest' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BlockShare">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="BlockShare">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'img/icon-192.png' %}" type="image/png" sizes="192x192">
  <meta name="bs-sw" content="{% url 'service_worker' %}">
