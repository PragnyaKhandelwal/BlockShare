<div class="tabs" data-tabs="{{ target }}" role="tablist">
  <button type="button" class="active" data-filter="all">All <span class="count"></span></button>
  <button type="button" data-filter="docs" data-hide-empty>Documents <span class="count"></span></button>
  <button type="button" data-filter="images" data-hide-empty>Images <span class="count"></span></button>
  <button type="button" data-filter="media" data-hide-empty>Audio &amp; video <span class="count"></span></button>
  <button type="button" data-filter="archives" data-hide-empty>Archives <span class="count"></span></button>
  <button type="button" data-filter="code" data-hide-empty>Code <span class="count"></span></button>
  <button type="button" data-filter="other" data-hide-empty>Other <span class="count"></span></button>
</div>
